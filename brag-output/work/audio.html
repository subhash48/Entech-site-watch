<!doctype html><html><head><meta charset="utf-8"></head><body><script>
// Score + SFX for the SiteWatch AI launch video, rendered offline (deterministic). 120 BPM, A minor, 21 s.
const SR = 48000, DUR = 21, BEAT = 0.5;
let seed = 1337; const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);

window.renderAudio = async function () {
  const ctx = new OfflineAudioContext(2, SR * DUR, SR);
  // ---- shared space: a soft plate-like reverb ----
  const ir = ctx.createBuffer(2, SR * 2.6, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = (rnd() * 2 - 1) * Math.pow(1 - i / d.length, 3.2) * (i < 400 ? i / 400 : 1); }
  const verb = ctx.createConvolver(); verb.buffer = ir;
  const verbIn = ctx.createGain(); verbIn.gain.value = 0.35; verbIn.connect(verb);
  const master = ctx.createGain(); master.gain.value = 0.9;
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.25;
  verb.connect(master); master.connect(comp); comp.connect(ctx.destination);
  const music = ctx.createGain(); music.gain.value = 0.62; music.connect(master); music.connect(verbIn);
  const sfx = ctx.createGain(); sfx.gain.value = 0.42; sfx.connect(master); sfx.connect(verbIn);
  // master fade at the end
  master.gain.setValueAtTime(0.9, 0); master.gain.setValueAtTime(0.9, 19.6); master.gain.linearRampToValueAtTime(0.0, 21);

  const noiseBuf = ctx.createBuffer(1, SR * 2, SR); { const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = rnd() * 2 - 1; }

  function env(g, t, a, peak, dec, sus = 0, rel = 0.3, hold = 0) {
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.setTargetAtTime(sus * peak, t + a, dec / 3);
    if (hold) { g.gain.setValueAtTime(sus * peak, t + a + hold); g.gain.setTargetAtTime(0, t + a + hold, rel / 3); }
  }
  function tone(dest, m, t, { type = "sine", a = 0.005, peak = 0.3, dec = 0.4, sus = 0, rel = 0.3, hold = 0, detune = 0, cutoff = 0, pan = 0 } = {}) {
    const o = ctx.createOscillator(); o.type = type; o.frequency.value = hz(m); o.detune.value = detune;
    const g = ctx.createGain(); env(g, t, a, peak, dec, sus, rel, hold);
    let node = o;
    if (cutoff) { const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cutoff; f.Q.value = 0.4; node.connect(f); node = f; }
    const p = ctx.createStereoPanner(); p.pan.value = pan;
    node.connect(g); g.connect(p); p.connect(dest);
    o.start(t); o.stop(t + a + Math.max(dec, hold) + rel + 1.5);
  }
  function noise(dest, t, dur, { type = "bandpass", f0 = 400, f1 = 4000, q = 0.8, peak = 0.25, pan = 0 } = {}) {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = ctx.createBiquadFilter(); f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + dur * 0.6); g.gain.linearRampToValueAtTime(0, t + dur);
    const p = ctx.createStereoPanner(); p.pan.value = pan;
    s.connect(f); f.connect(g); g.connect(p); p.connect(dest); s.start(t, rnd()); s.stop(t + dur + 0.05);
  }

  // ---- harmony: Am9 | Fmaj7 | C(add9) | G6, one chord per bar (2 s) ----
  const CHORDS = [[57, 60, 64, 67, 71], [53, 57, 60, 64, 67], [48, 55, 60, 62, 64], [55, 59, 62, 64, 67]];
  const ROOTS = [45, 41, 48, 43];
  for (let bar = 0; bar < 10; bar++) {
    const t = bar * 2, ch = CHORDS[bar % 4], last = bar >= 9;
    const padPeak = t < 3 ? 0.05 : 0.07;
    for (const m of ch) for (const det of [-7, 7]) tone(music, m, t, { type: "sawtooth", a: 0.6, peak: padPeak / 5, dec: 0.6, sus: 1, hold: last ? 2.6 : 1.4, rel: 0.8, detune: det, cutoff: 900 + bar * 120, pan: det / 20 });
    if (t >= 3 || bar === 1) tone(music, ROOTS[bar % 4] - 12, t, { type: "triangle", a: 0.02, peak: 0.22, dec: 0.5, sus: 0.6, hold: 1.7, rel: 0.2, cutoff: 300 });
  }
  // plucked arpeggio from the reveal (8th notes), quieter under the AI scene, out for the outro
  for (let i = 0; i < 60; i++) {
    const t = 3.0 + i * BEAT / 2; if (t >= 18) break;
    const ch = CHORDS[Math.floor(t / 2) % 4], m = ch[[0, 2, 4, 2, 1, 3, 4, 3][i % 8]] + 12;
    const quiet = t > 11 && t < 15 ? 0.55 : 1;
    tone(music, m, t, { type: "triangle", a: 0.003, peak: 0.07 * quiet, dec: 0.22, cutoff: 3200, pan: (i % 2 ? 0.25 : -0.25) });
  }
  // drums: soft kick on beats from 3.0, light hats from 7.0, out at 18.0
  for (let t = 3.0; t < 18; t += BEAT) {
    const o = ctx.createOscillator(); o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    const g = ctx.createGain(); env(g, t, 0.003, 0.32, 0.22); o.connect(g); g.connect(music); o.start(t); o.stop(t + 0.5);
    if (t >= 7) noise(music, t + BEAT / 2, 0.05, { type: "highpass", f0: 8000, f1: 9000, q: 0.5, peak: 0.035, pan: 0.2 });
  }

  // ---- SFX (same key, same room) ----
  tone(sfx, 33, 0.78, { a: 0.004, peak: 0.28, dec: 0.5 });                                  // thump on "88"
  tone(sfx, 69, 0.78, { type: "triangle", a: 0.004, peak: 0.08, dec: 0.6, cutoff: 2000 });
  noise(sfx, 1.25, 0.7, { f0: 2000, f1: 7000, q: 2, peak: 0.05, pan: 0.3 });                  // limit line shimmer
  noise(sfx, 2.55, 0.45, { type: "lowpass", f0: 300, f1: 5000, q: 0.7, peak: 0.12 });        // swell into the logo
  for (const m of [81, 88, 93]) tone(sfx, m, 3.0, { a: 0.005, peak: 0.07, dec: 1.4 });        // logo bell
  noise(sfx, 4.15, 0.55, { f0: 300, f1: 2400, q: 1.1, peak: 0.16 });                          // dashboard rises
  [81, 84, 88, 93].forEach((m, i) => tone(sfx, m, 5.05 + i * 0.25, { type: "triangle", a: 0.003, peak: 0.08, dec: 0.18, pan: -0.3 + i * 0.2 })); // KPI plucks
  noise(sfx, 6.62, 0.4, { f0: 2400, f1: 400, q: 1.1, peak: 0.12, pan: -0.4 });               // out
  noise(sfx, 7.0, 0.45, { f0: 400, f1: 2600, q: 1.1, peak: 0.11, pan: 0.4 });                // card in
  tone(sfx, 64, 8.05, { type: "square", a: 0.004, peak: 0.05, dec: 0.12, cutoff: 1200 });    // 'loud' blip, minor descent
  tone(sfx, 60, 8.2, { type: "square", a: 0.004, peak: 0.05, dec: 0.18, cutoff: 1100 });
  noise(sfx, 8.98, 0.35, { f0: 2400, f1: 500, q: 1.1, peak: 0.11, pan: 0.4 });
  [72, 76, 79, 84].forEach((m, i) => tone(sfx, m, 9.38 + i * 0.07, { a: 0.003, peak: 0.075, dec: 0.9, pan: -0.2 + i * 0.12 })); // activate chime
  noise(sfx, 10.72, 0.35, { f0: 2400, f1: 500, q: 1.1, peak: 0.1 });
  const q = 34; for (let i = 0; i < q; i++) { const t = 11.4 + (0.9 * i) / q + (rnd() - 0.5) * 0.008; noise(sfx, t, 0.025, { type: "highpass", f0: 3500, f1: 4500, q: 0.7, peak: 0.03, pan: (rnd() - 0.5) * 0.3 }); } // typing
  tone(sfx, 76, 12.45, { type: "triangle", a: 0.002, peak: 0.08, dec: 0.12 });              // send
  noise(sfx, 12.5, 0.45, { f0: 500, f1: 3000, q: 1, peak: 0.09 });
  for (const m of [69, 76]) tone(sfx, m, 12.75, { type: "sine", a: 0.25, peak: 0.05, dec: 0.9 }); // answer swell
  tone(sfx, 100, 13.45, { a: 0.002, peak: 0.04, dec: 0.5, pan: 0.3 });                       // source sparkle
  tone(sfx, 105, 13.55, { a: 0.002, peak: 0.03, dec: 0.5, pan: 0.35 });
  noise(sfx, 14.7, 0.4, { f0: 2400, f1: 500, q: 1.1, peak: 0.1, pan: -0.3 });
  noise(sfx, 15.0, 0.45, { f0: 400, f1: 2400, q: 1.1, peak: 0.1, pan: 0.3 });
  tone(sfx, 84, 16.15, { type: "triangle", a: 0.002, peak: 0.09, dec: 0.08 });              // click
  noise(sfx, 16.15, 0.03, { type: "highpass", f0: 3000, f1: 3200, q: 0.7, peak: 0.06 });
  tone(sfx, 79, 16.38, { a: 0.003, peak: 0.07, dec: 0.4 }); tone(sfx, 84, 16.5, { a: 0.003, peak: 0.07, dec: 0.7 }); // confirm
  noise(sfx, 17.6, 0.55, { type: "lowpass", f0: 400, f1: 6000, q: 0.7, peak: 0.14 });        // swell into outro
  for (const m of [57, 64, 69, 72, 76, 81]) tone(sfx, m, 18.15, { a: 0.01, peak: 0.06, dec: 2.2, sus: 0.25, hold: 1.2, rel: 1.4 }); // final chord
  tone(sfx, 33, 18.15, { a: 0.004, peak: 0.26, dec: 0.9 });

  const buf = await ctx.startRendering();
  // 16-bit PCM WAV
  const n = buf.length, data = new DataView(new ArrayBuffer(44 + n * 4));
  const w = (o, s) => [...s].forEach((c, i) => data.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); data.setUint32(4, 36 + n * 4, true); w(8, "WAVE"); w(12, "fmt "); data.setUint32(16, 16, true);
  data.setUint16(20, 1, true); data.setUint16(22, 2, true); data.setUint32(24, SR, true); data.setUint32(28, SR * 4, true);
  data.setUint16(32, 4, true); data.setUint16(34, 16, true); w(36, "data"); data.setUint32(40, n * 4, true);
  const L = buf.getChannelData(0), R = buf.getChannelData(1); let peak = 0;
  for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i]));
  const norm = peak > 0.89 ? 0.89 / peak : 1;
  for (let i = 0; i < n; i++) { data.setInt16(44 + i * 4, Math.max(-1, Math.min(1, L[i] * norm)) * 32767, true); data.setInt16(46 + i * 4, Math.max(-1, Math.min(1, R[i] * norm)) * 32767, true); }
  let bin = ""; const bytes = new Uint8Array(data.buffer);
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return { b64: btoa(bin), peak, norm };
};
</script></body></html>
