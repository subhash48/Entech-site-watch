<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #081738; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: Inter, sans-serif; color: #eef3ff;
    background: radial-gradient(120% 80% at 0% 0%, rgb(43 91 215 / .30), transparent 60%), linear-gradient(180deg, #0d2554 0%, #0a1d45 55%, #081738 100%); }
  .abs { position: absolute; will-change: transform, opacity; }
  .grid { inset: 0; background-image: linear-gradient(rgb(255 255 255 / .035) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / .035) 1px, transparent 1px);
    background-size: 64px 64px; mask-image: radial-gradient(70% 70% at 50% 50%, #000, transparent); }
  .shot { border-radius: 18px; box-shadow: 0 40px 120px -30px rgb(0 0 0 / .7), 0 0 0 1px rgb(255 255 255 / .08); overflow: hidden; }
  .shot img, img.fill { display: block; width: 100%; height: 100%; }
  .h1 { font-weight: 800; letter-spacing: -0.035em; line-height: 1.05; white-space: nowrap; }
  .cap { font-weight: 700; letter-spacing: -0.025em; font-size: 58px; text-align: center; left: 0; right: 0; white-space: nowrap; }
  .word { display: inline-block; will-change: transform, opacity; }
  .red { color: #ff6b6b; } .blue { color: #7fb2ff; } .muted { color: #9aa8c4; } .green { color: #4ade80; }
  .ring { border: 3px solid #ff6b6b; border-radius: 10px; box-shadow: 0 0 0 6px rgb(255 107 107 / .18), 0 0 40px rgb(255 107 107 / .45); }
  .glow { border: 3px solid #7fb2ff; border-radius: 999px; box-shadow: 0 0 0 6px rgb(127 178 255 / .18), 0 0 40px rgb(127 178 255 / .5); }
  .input { width: 1100px; height: 92px; border-radius: 22px; background: #111a2e; border: 2px solid rgb(127 178 255 / .45);
    box-shadow: 0 0 0 8px rgb(59 130 246 / .12), 0 30px 80px -30px rgb(0 0 0 / .7); display: flex; align-items: center; padding: 0 22px 0 36px; gap: 20px; }
  .input .text { flex: 1; font-size: 38px; font-weight: 500; color: #eef3ff; white-space: nowrap; overflow: hidden; }
  .caret { display: inline-block; width: 3px; height: 40px; background: #7fb2ff; vertical-align: -6px; margin-left: 3px; }
  .send { width: 64px; height: 64px; border-radius: 18px; background: #3b82f6; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px -8px rgb(59 130 246 / .9); }
  .toast { width: 640px; height: 112px; border-radius: 20px; background: #111a2e; border: 1px solid rgb(74 222 128 / .45);
    box-shadow: 0 30px 80px -20px rgb(0 0 0 / .8); display: flex; align-items: center; gap: 22px; padding: 0 28px; }
  .toast .ic { width: 60px; height: 60px; border-radius: 16px; background: rgb(74 222 128 / .14); display: flex; align-items: center; justify-content: center; }
  .toast b { display: block; font-size: 27px; font-family: "JetBrains Mono", monospace; font-weight: 500; color: #eef3ff; }
  .toast span { font-size: 22px; color: #4ade80; font-weight: 600; }
  .ripple { width: 120px; height: 120px; border-radius: 50%; border: 4px solid #7fb2ff; }
  .small { font-size: 26px; font-weight: 500; color: #9aa8c4; letter-spacing: -0.01em; text-align: center; left: 0; right: 0; white-space: nowrap; }
  .chip { display: inline-block; padding: 8px 18px; border-radius: 999px; background: rgb(255 255 255 / .06); border: 1px solid rgb(255 255 255 / .1); margin: 0 6px; }
</style></head>
<body><div id="stage">
  <div class="abs grid" id="grid"></div>

  <!-- 1 Hook -->
  <div class="abs h1" id="hook1" style="left:0;right:0;top:330px;text-align:center;font-size:124px"></div>
  <div class="abs" id="limitline" style="left:360px;top:500px;height:4px;width:1200px;background:linear-gradient(90deg,transparent,#ff6b6b 15%,#ff6b6b 85%,transparent);transform-origin:left"></div>
  <div class="abs h1 muted" id="hook2" style="left:0;right:0;top:560px;text-align:center;font-size:84px;font-weight:700"></div>

  <!-- 2 Reveal -->
  <div class="abs" id="logo" style="left:0;right:0;top:420px;display:flex;justify-content:center;align-items:center;gap:30px">
    <svg viewBox="0 0 32 32" width="150" height="150"><defs><linearGradient id="lb" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2b6ef2"/><stop offset="1" stop-color="#7fb2ff"/></linearGradient></defs>
      <g fill="url(#lb)"><rect class="bar" x="3" y="17" width="5" height="12" rx="1.2"/><rect class="bar" x="10" y="11" width="5" height="18" rx="1.2"/><rect class="bar" x="17" y="5" width="5" height="24" rx="1.2"/><rect class="bar" x="24" y="13" width="5" height="16" rx="1.2"/></g></svg>
    <div class="h1" style="font-size:140px">SiteWatch AI</div>
  </div>
  <div class="abs" id="dashwrap" style="left:288px;top:178px;width:1344px;height:840px;perspective:2400px">
    <div class="abs shot" id="dash" style="left:0;top:0;width:1344px;height:840px;transform-origin:50% 100%"><img src="assets/dash.png"></div>
    <div class="abs" id="s0" style="background:#0b1220;border-radius:16px;box-shadow:inset 0 0 0 1px rgb(255 255 255 / .07)"></div>
    <div class="abs" id="s1" style="background:#0b1220;border-radius:16px;box-shadow:inset 0 0 0 1px rgb(255 255 255 / .07)"></div>
    <div class="abs" id="s2" style="background:#0b1220;border-radius:16px;box-shadow:inset 0 0 0 1px rgb(255 255 255 / .07)"></div>
    <div class="abs" id="s3" style="background:#0b1220;border-radius:16px;box-shadow:inset 0 0 0 1px rgb(255 255 255 / .07)"></div>
    <div class="abs shot" id="k0" style="border-radius:16px"><img src="assets/kpi-sites.png"></div>
    <div class="abs shot" id="k1" style="border-radius:16px"><img src="assets/kpi-alerts.png"></div>
    <div class="abs shot" id="k2" style="border-radius:16px"><img src="assets/kpi-coverage.png"></div>
    <div class="abs shot" id="k3" style="border-radius:16px"><img src="assets/kpi-missing.png"></div>
  </div>
  <div class="abs cap" id="cap2" style="top:62px"></div>

  <!-- 3 Upload -->
  <div class="abs h1" id="cap3a" style="left:150px;top:380px;font-size:84px;line-height:1.08"></div>
  <div class="abs shot" id="valid" style="left:1110px;top:120px;width:640px;height:820px;background:#0b1220"><img src="assets/validation-invalid.png" style="width:640px;height:auto"></div>
  <div class="abs ring" id="ring" style="left:1121px;width:224px;height:46px"></div>
  <div class="abs cap" id="cap3b" style="top:150px"></div>
  <div class="abs shot" id="notice" style="left:110px;top:300px;width:1700px;height:81px"><img src="assets/data-notice.png"></div>
  <div class="abs shot" id="v0" style="border-radius:18px"><img src="assets/kpi-sites-v1.png"></div>
  <div class="abs shot" id="v1" style="border-radius:18px"><img src="assets/kpi-alerts-v1.png"></div>
  <div class="abs shot" id="v2" style="border-radius:18px"><img src="assets/kpi-coverage-v1.png"></div>
  <div class="abs shot" id="v3" style="border-radius:18px"><img src="assets/kpi-missing-v1.png"></div>

  <!-- 4 AI -->
  <div class="abs cap" id="cap4" style="top:110px"></div>
  <div class="abs input" id="input" style="left:410px;top:330px">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#7fb2ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>
    <div class="text" id="typed"></div>
    <div class="send" id="send"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.714 3.048a.498.498 0 0 0-.683.627l2.843 7.627a2 2 0 0 1 0 1.396l-2.842 7.627a.498.498 0 0 0 .682.627l18-8.5a.5.5 0 0 0 0-.904z"/><path d="M6 12h16"/></svg></div>
  </div>
  <div class="abs shot" id="answer" style="left:398px;top:300px;width:1125px;height:451px;background:#0b1220"><img src="assets/answer.png"></div>
  <div class="abs glow" id="chip" style="left:493px;top:644px;width:393px;height:49px"></div>

  <!-- 5 Reports -->
  <div class="abs shot" id="reports" style="left:288px;top:200px;width:1344px;height:840px;transform-origin:0 0"><img src="assets/reports.png"></div>
  <div class="abs ripple" id="ripple"></div>
  <svg class="abs" id="cursor" width="46" height="46" viewBox="0 0 24 24"><path d="M4 2l16 11-7 1.5L16.5 22l-3 1.3-3.5-7.6L4 20z" fill="#fff" stroke="#0b1220" stroke-width="1.3" stroke-linejoin="round"/></svg>
  <div class="abs toast" id="toast" style="left:1180px;top:860px">
    <div class="ic"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
    <div><b>sitewatch-summary-v1.pdf</b><span>Downloaded · dataset v1</span></div>
  </div>
  <div class="abs cap" id="cap5" style="top:34px"></div>

  <!-- 6 Outro -->
  <div class="abs" id="outbg" style="left:-96px;top:-60px;width:2112px;height:1320px"><img class="fill" src="assets/dash-v1.png" style="filter:blur(14px) brightness(.35) saturate(1.2)"></div>
  <div class="abs" id="outlogo" style="left:0;right:0;top:330px;display:flex;justify-content:center;align-items:center;gap:30px">
    <svg viewBox="0 0 32 32" width="132" height="132"><g fill="url(#lb)"><rect x="3" y="17" width="5" height="12" rx="1.2"/><rect x="10" y="11" width="5" height="18" rx="1.2"/><rect x="17" y="5" width="5" height="24" rx="1.2"/><rect x="24" y="13" width="5" height="16" rx="1.2"/></g></svg>
    <div class="h1" style="font-size:128px">SiteWatch AI</div>
  </div>
  <div class="abs h1" id="tagline" style="left:0;right:0;top:530px;text-align:center;font-size:62px;font-weight:700;color:#cfdcff"></div>
  <div class="abs small" id="meta" style="top:680px"><span class="chip">github.com/subhash48/Entech-site-watch</span></div>
  <div class="abs small" id="stack" style="top:760px;font-size:22px">Next.js · FastAPI · PostgreSQL · Groq GPT-OSS 120B</div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const out = (x) => 1 - Math.pow(1 - x, 3);
const inOut = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = (x) => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const set = (el, o, tf = "", extra = {}) => { el.style.opacity = o; el.style.transform = tf; el.style.visibility = o <= 0.001 ? "hidden" : "visible"; Object.assign(el.style, extra); };
/** Words that rise in one by one between a and b, then leave between c and d. */
function words(el, items, t, a, b, c, d, stagger) {
  if (!el._w) { el.innerHTML = items.map((w) => w === "<br>" ? "<br>" : `<span class="word">${w}</span>`).join(" "); el._w = [...el.querySelectorAll(".word")]; }
  const n = el._w.length, step = stagger ?? (b - a) / Math.max(1, n);
  el._w.forEach((w, i) => {
    const p = out(lin(t, a + i * step, a + i * step + 0.38));
    const q = c === undefined ? 0 : inOut(lin(t, c + i * 0.025, d));
    set(w, p * (1 - q), `translateY(${(1 - p) * 34 - q * 30}px)`, { filter: `blur(${(1 - p) * 8}px)` });
  });
  el.style.visibility = "visible"; el.style.opacity = 1; el.style.transform = "";
}
const vis = (t, a, b) => t >= a && t < b;
const KPI = [[252, 89], [546, 89], [840, 89], [1134, 89]];
const S = 1344 / 1440;   // dashboard capture scale on stage

window.render = function (t) {
  // background grid drifts slowly
  $("grid").style.transform = `translate(${-(t * 6) % 64}px, ${-(t * 4) % 64}px)`;

  // ---------- 1 Hook 0-3 ----------
  const h1on = vis(t, 0, 3.05);
  const n88 = Math.round(80 + 8 * out(lin(t, 0.55, 1.05)));
  if (h1on) {
    words($("hook1"), ["125", "Broad", "St", "hit", '<b class="red" id="n88">88</b>', "dBA."], t, 0.12, 0.95, 2.72, 3.0, 0.16);
    const n = document.getElementById("n88"); if (n) n.textContent = n88;
    words($("hook2"), ["The", "limit", "was", '<span style="color:#eef3ff">85</span>.'], t, 1.3, 1.75, 2.75, 3.0, 0.12);
    set($("limitline"), (1 - lin(t, 2.7, 2.95)) * out(lin(t, 1.25, 1.9)), `scaleX(${out(lin(t, 1.25, 1.9))})`);
  } else { ["hook1", "hook2", "limitline"].forEach((id) => set($(id), 0)); }

  // ---------- 2 Reveal 3-7 ----------
  const logoIn = out(lin(t, 3.0, 3.55)), logoOut = inOut(lin(t, 3.95, 4.35));
  set($("logo"), vis(t, 2.95, 4.5) ? logoIn * (1 - logoOut) : 0, `translateY(${(1 - logoIn) * 40 - logoOut * 120}px) scale(${0.92 + 0.08 * logoIn - 0.15 * logoOut})`);
  document.querySelectorAll("#logo .bar").forEach((r, i) => { const p = back(lin(t, 3.0 + i * 0.07, 3.45 + i * 0.07)); r.style.transform = `scaleY(${clamp(p, 0, 1.2)})`; r.style.transformOrigin = "center bottom"; r.style.transformBox = "fill-box"; });
  const dIn = out(lin(t, 4.2, 5.0)), dOut = inOut(lin(t, 6.72, 7.0));
  const dashOn = vis(t, 3.9, 7.02);
  set($("dashwrap"), dashOn ? 1 - dOut : 0, `translateX(${-dOut * 140}px)`);
  set($("dash"), dashOn ? dIn : 0, `translateY(${(1 - dIn) * 260}px) rotateX(${(1 - dIn) * 26}deg) scale(${0.9 + 0.1 * dIn})`);
  KPI.forEach(([x, y], i) => {
    // Each KPI lifts out of its slot, then settles exactly back into place.
    const a = 5.05 + i * 0.25, p = out(lin(t, a, a + 0.3)), settle = inOut(lin(t, a + 0.45, a + 0.8));
    const lift = p * (1 - settle);
    const geo = { left: `${x * S}px`, top: `${y * S}px`, width: `${278 * S}px`, height: `${92 * S}px` };
    set($(`s${i}`), dashOn && lift > 0.01 ? Math.min(1, lift * 4) : 0, "", geo);
    set($(`k${i}`), dashOn && t >= a ? 1 : 0, `translateY(${-14 * lift}px) scale(${1 + 0.07 * lift})`,
      { left: `${x * S}px`, top: `${y * S}px`, width: `${278 * S}px`, height: `${92 * S}px`,
        boxShadow: `0 ${20 * lift}px ${60 * lift}px -10px rgb(0 0 0 / .8), 0 0 ${40 * lift}px rgb(127 178 255 / ${0.45 * lift}), 0 0 0 1px rgb(255 255 255 / .1)` });
  });
  if (vis(t, 4.4, 7.05)) words($("cap2"), ["Every", "site.", "Every", "limit.", '<span class="blue">One</span>', '<span class="blue">screen.</span>'], t, 4.5, 4.95, 6.72, 6.98, 0.09); else set($("cap2"), 0);

  // ---------- 3 Upload 7-11 ----------
  const u = vis(t, 6.95, 9.35);
  if (u) words($("cap3a"), ["Every", "uploaded", "<br>", "row", "gets", '<span class="red">checked.</span>'], t, 7.1, 7.45, 9.0, 9.3, 0.08); else set($("cap3a"), 0);
  const vin = out(lin(t, 7.05, 7.6)), vout = inOut(lin(t, 9.0, 9.3));
  set($("valid"), u ? vin * (1 - vout) : 0, `translateX(${(1 - vin) * 160 + vout * 160}px)`);
  const rp = out(lin(t, 8.05, 8.35)), pulse = 0.5 + 0.5 * Math.sin((t - 8.05) * 9);
  set($("ring"), vis(t, 8.0, 9.3) ? rp * (1 - vout) : 0, `scale(${1.25 - 0.25 * rp + 0.03 * pulse})`, { top: "791px" });
  const s = vis(t, 9.1, 11.05);
  if (s) words($("cap3b"), ["Fix.", "Activate.", '<span class="green">Roll</span>', '<span class="green">back</span>', '<span class="green">anytime.</span>'], t, 9.15, 9.4, 10.75, 11.0, 0.07); else set($("cap3b"), 0);
  const nIn = out(lin(t, 9.3, 9.75)), sOut = inOut(lin(t, 10.75, 11.0));
  set($("notice"), s ? nIn * (1 - sOut) : 0, `translateY(${(1 - nIn) * 30 - sOut * 30}px) scale(${0.96 + 0.04 * nIn})`);
  for (let i = 0; i < 4; i++) {
    const a = 9.5 + i * 0.12, p = back(lin(t, a, a + 0.45));
    const w = 400, gap = 33, x0 = (1920 - (4 * w + 3 * gap)) / 2;
    set($(`v${i}`), s ? clamp(lin(t, a, a + 0.2)) * (1 - sOut) : 0, `translateY(${(1 - clamp(p, 0, 1.2)) * 50 - sOut * 30}px) scale(${0.9 + 0.1 * clamp(p, 0, 1.1)})`,
      { left: `${x0 + i * (w + gap)}px`, top: "450px", width: `${w}px`, height: `${w * 186 / 556}px` });
  }

  // ---------- 4 AI 11-15 ----------
  const ai = vis(t, 10.95, 15.05);
  if (ai) words($("cap4"), ["Ask", "in", "plain", "English.", '<span class="blue">Answers</span>', '<span class="blue">cite</span>', '<span class="blue">the</span>', '<span class="blue">data.</span>'], t, 11.1, 11.55, 14.72, 14.98, 0.06); else set($("cap4"), 0);
  const q = "Which sites exceeded their limits?";
  const inIn = out(lin(t, 11.05, 11.45)), inOut_ = inOut(lin(t, 12.55, 12.85));
  set($("input"), ai ? inIn * (1 - inOut_) : 0, `translateY(${(1 - inIn) * 40 - inOut_ * 60}px) scale(${1 - 0.04 * inOut_})`);
  const chars = Math.round(q.length * lin(t, 11.4, 12.3));
  $("typed").innerHTML = q.slice(0, chars) + (t < 12.45 && Math.floor(t * 3) % 2 === 0 ? '<span class="caret"></span>' : '<span class="caret" style="opacity:0"></span>');
  const press = Math.sin(Math.PI * lin(t, 12.38, 12.58));
  $("send").style.transform = `scale(${1 - 0.12 * press})`;
  const aIn = out(lin(t, 12.7, 13.25)), aOut = inOut(lin(t, 14.72, 15.0));
  set($("answer"), ai ? aIn * (1 - aOut) : 0, `translateY(${(1 - aIn) * 70 - aOut * 40}px) scale(${0.97 + 0.03 * aIn})`);
  const cg = out(lin(t, 13.45, 13.8)), cp = 0.5 + 0.5 * Math.sin((t - 13.45) * 7);
  set($("chip"), ai && t > 13.4 ? cg * (1 - aOut) : 0, `translateY(${-aOut * 40}px) scale(${1.15 - 0.15 * cg + 0.02 * cp})`);

  // ---------- 5 Reports 15-18 ----------
  const rep = vis(t, 14.95, 18.05);
  const rIn = out(lin(t, 15.0, 15.45)), zoom = inOut(lin(t, 15.35, 16.0)), rOut = inOut(lin(t, 17.75, 18.0));
  // zoom in around the real Download PDF button (page px 1098,125, 130x28)
  const bxS = (1098 + 65) * S, byS = (125 + 14) * S, z = 1 + 0.6 * zoom;
  set($("reports"), rep ? rIn * (1 - rOut) : 0, `translateY(${(1 - rIn) * 60}px) scale(${z})`, { transformOrigin: `${bxS}px ${byS}px` });
  const btnX = 288 + bxS, btnY = 200 + byS;
  const cIn = out(lin(t, 15.75, 16.15));
  set($("cursor"), rep && t > 15.7 ? cIn * (1 - rOut) : 0, `translate(${btnX + 12 + (1 - cIn) * 260}px, ${btnY + 6 + (1 - cIn) * 200}px) scale(${1 - 0.12 * Math.sin(Math.PI * lin(t, 16.15, 16.35))})`, { left: "0", top: "0" });
  const rip = lin(t, 16.2, 16.75);
  set($("ripple"), rep && rip > 0 && rip < 1 ? (1 - rip) * 0.9 : 0, `translate(${btnX - 60}px, ${btnY - 60}px) scale(${0.3 + 1.2 * out(rip)})`, { left: "0", top: "0" });
  const tIn = back(lin(t, 16.35, 16.85));
  set($("toast"), rep ? clamp(lin(t, 16.35, 16.55)) * (1 - rOut) : 0, `translateX(${(1 - clamp(tIn, 0, 1.1)) * 200}px)`);
  if (rep) words($("cap5"), ["Client-ready", '<span class="blue">PDF</span>', '<span class="blue">and</span>', '<span class="blue">CSV.</span>', "One", "click."], t, 15.15, 15.5, 17.75, 17.98, 0.07); else set($("cap5"), 0);

  // ---------- 6 Outro 18-21 ----------
  const o = vis(t, 17.9, 99);
  const oIn = out(lin(t, 17.95, 18.6));
  set($("outbg"), o ? oIn : 0, `scale(${1.04 - 0.04 * lin(t, 18, 21)})`);
  const lgIn = out(lin(t, 18.15, 18.6));
  set($("outlogo"), o ? lgIn : 0, `translateY(${(1 - lgIn) * 40}px) scale(${0.94 + 0.06 * lgIn})`);
  if (o) words($("tagline"), ["Construction-site", "monitoring", '<span class="blue">on</span>', '<span class="blue">one</span>', '<span class="blue">screen.</span>'], t, 18.4, 18.7, undefined, undefined, 0.05); else set($("tagline"), 0);
  set($("meta"), o ? out(lin(t, 18.75, 19.1)) : 0, `translateY(${(1 - out(lin(t, 18.75, 19.1))) * 20}px)`);
  set($("stack"), o ? out(lin(t, 18.9, 19.25)) : 0, "");
};
